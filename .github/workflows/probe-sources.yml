name: Probe product sources

on:
  workflow_dispatch:
    inputs:
      domains:
        description: Space-separated store domains to probe
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sources.mjs ${{ inputs.domains }}
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources
          git commit -m "Update product source snapshot" || exit 0
          git push
