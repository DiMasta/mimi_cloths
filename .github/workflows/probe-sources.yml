name: Probe product sources

# Runs whenever the list of stores changes; the snapshot it commits
# back does not touch these paths, so it never re-triggers itself.
on:
  push:
    paths:
      - scripts/sources.txt
      - scripts/probe-sources.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sources.mjs $(grep -v '^#' scripts/sources.txt)
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources
          git commit -m "Update product source snapshot" || exit 0
          git pull --rebase
          git push
